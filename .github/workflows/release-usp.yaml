name: USP Release

on:
  push:
    tags: [ "v*-usp.*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v2.46.1-usp.1)
        required: true
        type: string
      rebuild:
        description: Rebuild and push the image. If false, only the VEX is updated from the dispatched branch.
        default: false
        required: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-usp-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE_NAME: dex-usp
  TRIVY_VERSION: v0.70.0

jobs:
  image:
    name: Build image and SBOM
    if: github.event_name == 'push' || inputs.rebuild
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      packages: write
      id-token: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set image repository
        id: repo
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Gather build metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.repo.outputs.value }}
          flavor: |
            latest = false
          tags: |
            type=raw,value=${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.vendor=United Security Providers

      - name: Get version from git-version script
        id: version
        run: echo "value=$(bash ./scripts/git-version)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=distroless
            VERSION=${{ steps.version.outputs.value }}
            COMMIT_HASH=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          push: true

      - name: Sign image
        run: cosign sign --yes "${{ steps.repo.outputs.value }}@${{ steps.build.outputs.digest }}"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.repo.outputs.value }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Trivy (not syft) so bom-refs are purls, which the VEX affects refs rely on.
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ steps.repo.outputs.value }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: ${{ env.IMAGE_NAME }}-${{ env.TAG }}.sbom.cdx.json
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/amd64

      - name: Attest SBOM
        run: |
          cosign attest --yes --type cyclonedx \
            --predicate "${IMAGE_NAME}-${TAG}.sbom.cdx.json" \
            "${{ steps.repo.outputs.value }}@${{ steps.build.outputs.digest }}"

      - name: Create release and attach SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prev=$(git describe --tags --abbrev=0 --match 'v*-usp.*' "${TAG}^" 2>/dev/null || true)
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes ${prev:+--notes-start-tag "$prev"}
          fi
          gh release upload "$TAG" "${IMAGE_NAME}-${TAG}.sbom.cdx.json" --clobber

  vex:
    name: Publish VEX
    needs: image
    if: ${{ !cancelled() && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write

    steps:
      # On dispatch the VEX is taken from the dispatched branch, so it can be updated after the release.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image digest
        id: image
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          if [ -z "$DIGEST" ]; then
            DIGEST=$(docker buildx imagetools inspect "${repo}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Download SBOM from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -p "${IMAGE_NAME}-${TAG}.sbom.cdx.json" --clobber

      # Trivy only applies CycloneDX VEX through BOM-Links into the scanned SBOM.
      - name: Bind VEX to image and SBOM
        env:
          REPO: ${{ steps.image.outputs.repo }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          sbom="${IMAGE_NAME}-${TAG}.sbom.cdx.json"
          purl="pkg:oci/${IMAGE_NAME}@${DIGEST/:/%3A}?repository_url=${REPO}&tag=${TAG}"
          jq \
            --arg serial "$(jq -r '.serialNumber | sub("^urn:uuid:"; "")' "$sbom")" \
            --arg sbomVersion "$(jq -r '.version' "$sbom")" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg name "$IMAGE_NAME" --arg tag "$TAG" --arg purl "$purl" \
            '.metadata.timestamp = $ts
             | .metadata.component = {type: "container", name: $name, version: $tag, "bom-ref": $purl, purl: $purl}
             | .vulnerabilities[].affects[].ref |= "urn:cdx:\($serial)/\($sbomVersion)#\(.)"' \
            dex.vex.cdx.json > "${IMAGE_NAME}-${TAG}.vex.cdx.json"

      # Shares the daily trivy-db cache with artifacts.yaml to avoid TOOMANYREQUESTS.
      - name: Get date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore trivy cache
        id: trivy-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache/db
          key: trivy-cache-${{ steps.date.outputs.date }}
          restore-keys: trivy-cache-

      - name: Scan SBOM with VEX applied
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: sbom
          scan-ref: ${{ env.IMAGE_NAME }}-${{ env.TAG }}.sbom.cdx.json
          format: sarif
          output: trivy-results.sarif
          cache-dir: ./cache
        env:
          TRIVY_VEX: ${{ env.IMAGE_NAME }}-${{ env.TAG }}.vex.cdx.json
          TRIVY_SKIP_DB_UPDATE: ${{ steps.trivy-cache.outputs.cache-hit == 'true' }}
          TRIVY_SKIP_JAVA_DB_UPDATE: ${{ steps.trivy-cache.outputs.cache-hit == 'true' }}

      - name: Summarize scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: sbom
          scan-ref: ${{ env.IMAGE_NAME }}-${{ env.TAG }}.sbom.cdx.json
          format: table
          output: trivy-results.txt
          cache-dir: ./cache
        env:
          TRIVY_VEX: ${{ env.IMAGE_NAME }}-${{ env.TAG }}.vex.cdx.json
          TRIVY_SHOW_SUPPRESSED: "true"
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"

      - name: Write scan summary
        run: |
          { echo '```'; cat trivy-results.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      ## Trivy-db uses `0600` permissions, actions/cache needs it readable.
      - name: Change permissions for trivy.db
        run: chmod 0644 ./cache/db/trivy.db

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "[${{ github.job }}] Trivy scan results"
          path: trivy-results.sarif
          retention-days: 5
          overwrite: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3.29.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ env.IMAGE_NAME }}

      - name: Attest VEX
        run: |
          cosign attest --yes --type https://cyclonedx.org/vex \
            --predicate "${IMAGE_NAME}-${TAG}.vex.cdx.json" \
            "${{ steps.image.outputs.repo }}@${{ steps.image.outputs.digest }}"

      - name: Attach VEX to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${IMAGE_NAME}-${TAG}.vex.cdx.json" --clobber
